name: CI

# We can specify which Github events will trigger a CI build

on: push

# now define a single job 'build' (but could define more)
jobs:
  build:
    # Here we add the matrices definition:
    strategy:
        matrix:
          os: ["ubuntu-latest", "macos-latest", "windows-latest"]
          python-version: ["3.10", "3.11", "3.12"]
         # Here we add the reference to the os matrix values
    runs-on: ${{ matrix.os }}

    # steps represent a sequence of tasks to be performed as part of the job
    steps:
      # first step is to check out the code from the repository and set up python
      - name: checkout repository
        uses: actions/checkout@v4

      # next set up python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # next install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt .

      # finally run the tests
      - name: Test with PyTest
        run: |
          python -m pytest --cov=inflammation.models tests/test_models.py